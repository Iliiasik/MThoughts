plugins {
    id 'java-library'
}

group = maven_group
version = "${mod_version}+${project.name}.${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = uri('https://maven.parchmentmc.org/')
                },
                maven {
                    name = 'NeoForged'
                    url = uri('https://maven.neoforged.net/releases')
                }
        )
        filter {
            includeGroup('org.parchmentmc.data')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_range'       : fabric_minecraft_range,
            'fabric_api_version'           : fabric_api_version,
            'loader_version'               : loader_version,
            'loader_version_range'         : loader_version_range,
            'forge_version'                : forge_version,
            'forge_version_range'          : forge_version_range,
            'forge_loader_version_range'   : forge_loader_version_range,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_license'                  : mod_license,
            'mod_version'                  : mod_version,
            'mod_authors'                  : mod_authors,
            'mod_description'              : mod_description,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
    filteringCharset 'UTF-8'
}
