modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Iliiasik/MThoughts/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://iliiasik.github.io/MThoughts-Wiki/"
logoFile = "assets/${mod_id}/textures/gui/shared/icon.png"
logoBlur = false
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kubejs"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "mca"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "sereneseasons"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
