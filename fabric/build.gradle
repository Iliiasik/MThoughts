plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = uri('https://maven.terraformersmc.com/releases')
        content {
            includeGroup 'com.terraformersmc'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

loom {
    runs {
        client {
            client()
            displayName = 'Fabric Client'
            generateRunConfig = true
            runDirectory = file('runs/client')
        }
        server {
            server()
            displayName = 'Fabric Server'
            generateRunConfig = true
            runDirectory = file('runs/server')
        }
        gametest {
            server()
            displayName = 'Fabric Game Test Server'
            generateRunConfig = true
            runDirectory = file('runs/gametest')
            jvmArguments.add('-Dfabric-api.gametest')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
