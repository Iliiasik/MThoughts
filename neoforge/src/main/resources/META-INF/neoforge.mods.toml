modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://iliiasik.github.io/MThoughts-Wiki/"
logoFile = "${mod_id}_banner.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties."${mod_id}"]
catalogueImageIcon = "${mod_id}_icon.png"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kubejs"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
