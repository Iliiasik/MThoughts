# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Project
java_version=25
maven_group=midnightthoughts

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
## Version of NeoForm the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Mod Properties
mod_id=midnightthoughts
mod_name=Midnight Thoughts
mod_version=1.5.4
mod_license=MIT
mod_authors=Iliiasik
mod_description=Diversify your gameplay and sleep mechanics with a comfort system, bedtime facts, nightmares, and general statistics since your last sleep. With full server support and convenient tools for building your world's lore through sleep facts and achievements

# Fabric
loom_version=1.17-SNAPSHOT
loader_version=0.19.3
loader_version_range=>=0.19.3
fabric_minecraft_range=~26.1.2
fabric_api_version=0.155.2+26.1.2

# NeoForge
moddev_version=2.0.143
neoforge_version=26.1.2.94
neoforge_version_range=[26.1.2,)
neoforge_loader_version_range=[4,)

# KubeJS, NeoForge only on 26.1.2
kubejs_version=26.1.2-8.0.4
rhino_version=2101.2.8-build.91

# Shared tooling
## Both loaders bundle Fabric Mixin and MixinExtras, so 'common' may compile against them
sponge_mixin_version=0.17.3+mixin.0.8.7
mixin_extras_version=0.5.3
junit_version=5.13.4
